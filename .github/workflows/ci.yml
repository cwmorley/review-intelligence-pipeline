name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run scoring example
        run: >-
          python -m review_intelligence score
          --reviews data/synthetic_reviews.csv
          --engagements data/synthetic_engagements.csv
          --candidates data/synthetic_candidates.csv
          --products data/synthetic_products.csv
          --target-make Northstar
          --as-of 2026-09-04
          --strict
          --output examples/ci-synthetic-scores.csv
      - name: Run offline LLM extraction eval gate
        run: >-
          python -m review_intelligence llm-eval
          --golden evals/golden_reviews.json
          --provider offline-perfect
          --min verdict_accuracy=1.0
          --min competitor_precision=1.0
          --min competitor_recall=1.0
          --min quote_grounding_rate=1.0
          --output examples/ci-llm-eval-report.json
