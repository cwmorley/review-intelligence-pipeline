[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-intelligence-pipeline"
version = "0.1.0"
description = "Evidence-first review collection, normalization, and Net Reviewer Score decision support"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
review-intelligence = "review_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

